<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Theocracy of Contrapunctia</title>
  <style>
    :root {
      --color-primary-blue: #4484ce;    /* Top stripe of the flag */
      --color-deep-teal: #00565b;       /* Middle stripe of the flag */
      --color-bg-light: #f4f7f6;        /* Subtle grayish-teal tint background */
      --color-white: #ffffff;
      --color-text-dark: #1c2d30;       /* High-contrast dark slate for reading */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: var(--color-bg-light);
      color: var(--color-text-dark);
      text-align: center;
    }

    header {
      background: var(--color-primary-blue);
      color: var(--color-white);
      padding: 40px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 10px 0 0 0;
      font-size: 16px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .nav {
      background: var(--color-deep-teal);
      padding: 12px 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .nav button {
      background: transparent;
      color: var(--color-white);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .nav button:hover {
      background: var(--color-white);
      color: var(--color-deep-teal);
      border-color: var(--color-white);
    }

    .container {
      max-width: 750px;
      margin: 50px auto;
      background: var(--color-white);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      text-align: left;
    }

    .container h2 {
      color: var(--color-deep-teal);
      margin-top: 0;
      font-size: 24px;
      border-bottom: 2px solid var(--color-bg-light);
      padding-bottom: 12px;
    }

    .container p {
      font-size: 16px;
      line-height: 1.7;
      color: #3d4f52;
    }
  </style>
</head>
<body>

  <header>
    <h1>Contrapunctia</h1>
    <p>A Sovereign Theocracy</p>
  </header>

  <div class="nav">
    <button onclick="window.location='overview.html'">Overview</button>
    <button onclick="window.location='declaration.html'">Declaration of Independence</button>
    <button onclick="window.location='government.html'">Government & Administration</button>
    <button onclick="window.location='indeks.html'">Interslavic Version</button>
  </div>

  <div class="container">
    <h2>What Is Contrapunctia?</h2>
    <p>
      <strong>Contrapunctia</strong> is a country I founded (better description coming soon). 
    </p>
  </div>

</body>
</html>
